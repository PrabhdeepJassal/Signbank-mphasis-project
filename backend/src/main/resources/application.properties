
spring.application.name=signbank-backend

# ── Database (H2 file-based — portable, just copy the data/ folder) ──
spring.datasource.url=jdbc:h2:file:./data/signbankdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway manages schema + seed data, Hibernate validates against entities
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# H2 Console (useful for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Server ───────────────────────────────────
server.port=${PORT:8080}
