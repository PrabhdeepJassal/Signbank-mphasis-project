
spring.application.name=signbank-backend

# ── Database (H2 file-based — portable, just copy the data/ folder) ──
spring.datasource.url=jdbc:h2:file:./data/signbankdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

# Seed data (runs after DDL, skips duplicates via MERGE INTO)
spring.sql.init.mode=always

# H2 Console (useful for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── Server ───────────────────────────────────
server.port=${PORT:8080}
